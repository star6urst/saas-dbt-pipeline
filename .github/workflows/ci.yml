name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  dbt-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: project-256beac9-89c1-4aed-ab4
          workload_identity_provider: projects/552215230759/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-ci-sa@project-256beac9-89c1-4aed-ab4.iam.gserviceaccount.com

      - name: Set up dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          saas_dbt:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: project-256beac9-89c1-4aed-ab4
                dataset: saas_dbt
                threads: 4
                location: US
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: Run dbt build
        run: dbt build